<script>
(function () {
    var STORAGE_KEY = 'lucency09_chat_messages';
    var MAX_MESSAGES = 100;

    function loadMessages() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveMessages(msgs) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-MAX_MESSAGES)));
        } catch (e) {}
    }

    function formatTime(ts) {
        var d = new Date(ts);
        var pad = function (n) { return n < 10 ? '0' + n : n; };
        return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
               pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
    }

    function renderMessages(msgs) {
        var container = document.getElementById('chat-messages');
        var emptyHint = document.getElementById('chat-empty-hint');
        // Remove only message bubbles, keeping the empty hint element intact
        var bubbles = container.querySelectorAll('.chat-message');
        bubbles.forEach(function (el) { el.remove(); });
        if (msgs.length === 0) {
            emptyHint.style.display = 'block';
            return;
        }
        emptyHint.style.display = 'none';
        msgs.forEach(function (msg) {
            var div = document.createElement('div');
            div.className = 'chat-message me';
            div.innerHTML =
                '<div class="bubble">' + escapeHtml(msg.text) + '</div>' +
                '<div class="meta">' + escapeHtml(msg.name) + ' · ' + formatTime(msg.ts) + '</div>';
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        var nameInput = document.getElementById('chat-name-input');
        var textInput = document.getElementById('chat-text-input');
        var name = nameInput.value.trim() || '匿名';
        var text = textInput.value.trim();
        if (!text) return;
        var msgs = loadMessages();
        msgs.push({ name: name, text: text, ts: Date.now() });
        saveMessages(msgs);
        renderMessages(loadMessages());
        textInput.value = '';
        textInput.focus();
    }

    document.addEventListener('DOMContentLoaded', function () {
        renderMessages(loadMessages());

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-text-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    });
})();
</script>
